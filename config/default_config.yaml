# PatchStack Security Assessment Engine Configuration

scanner:
  target_url: "http://127.0.0.1:5000"
  timeout: 10
  user_agent: "PatchStack-Security-Scanner/1.0"
  follow_redirects: true
  max_retries: 3
  threads: 4

logging:
  level: "INFO"
  format: "console"  # options: console, json
  file_path: "patchstack_scan.log"
  verbose: false

detectors:
  enabled:
    - security_headers
    - cookie_security
    - info_disclosure
    - dangerous_methods
    - cors_misconfig
    - auth_session

reports:
  output_dir: "reports/output"
  default_format: "json"
